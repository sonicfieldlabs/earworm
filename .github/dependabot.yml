version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 28 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - "/packages/py-akousma"
      - "/packages/sdk-python"
    schedule:
      interval: cron
      cronjob: "0 10 28 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-pip:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 28 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
