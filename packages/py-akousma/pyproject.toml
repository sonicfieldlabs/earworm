[project]
name = "akousma"
version = "0.3.0"
description = "Python reference implementation of the Sonic Field akousma sonic-memory protocol (part of Earworm)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Sonic Field Labs" }]
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akousma"]
artifacts = ["akousma/akousma.schema.json"]
